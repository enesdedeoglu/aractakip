name: Tesla ilan taraması

on:
  # Bulut taraması şimdilik kapalı (veriler bilgisayardaki ajandan geliyor).
  # Tekrar açmak için aşağıdaki iki satırın başındaki # işaretlerini kaldırın:
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Tarama modu (auto / quick / full / deploy)'
        default: auto
  # Site artık ajan tarafından gh-pages dalına yayınlanıyor (src/publish.js); push tetikleyicisi kaldırıldı

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape-${{ github.event_name == 'push' && 'deploy' || 'scan' }}
  cancel-in-progress: false

jobs:
  scrape:
    # mode=deploy: yalnızca siteyi yeniden yayınla (ör. mail ayarı değişince)
    if: github.event_name != 'push' && github.event.inputs.mode != 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      saved: ${{ steps.scan.outputs.saved }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tara
        id: scan
        run: node src/run.js --runner=cloud --mode=${{ github.event.inputs.mode || 'auto' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARACTAKIP_REPO: ${{ github.repository }}
          ARACTAKIP_DATA_KEY: ${{ secrets.ARACTAKIP_DATA_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  deploy:
    needs: scrape
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.scrape.outputs.saved == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Siteyi hazırla
        run: |
          mkdir -p _site/data
          cp -r web/* _site/
          # Tarayıcı önbelleği eski app.js/styles.css'i kullanmasın
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" _site/index.html
          # Veri şifreliyse yalnızca şifreli dosya yayınlanır (şifresiz kopya geçiş sırasında silinir)
          if [ -f data/db.enc.json ]; then cp data/db.enc.json _site/data/db.enc.json
          elif [ -f data/db.json ]; then cp data/db.json _site/data/db.json; fi
          # Android Firefox'a tarayıcıdan kurulabilsin diye eklenti paketi de yayınlanır
          sh scripts/build-firefox.sh _site/aractakip-firefox.xpi
          # Firefox otomatik güncelleme bildirimi
          node -e "const v=require('./extension/manifest.firefox.json').version;console.log(JSON.stringify({addons:{'aractakip@enesdedeoglu':{updates:[{version:v,update_link:'https://enesdedeoglu.github.io/aractakip/aractakip-firefox.xpi'}]}}}))" > _site/updates.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
