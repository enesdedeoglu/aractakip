<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px -apple-system, Segoe UI, sans-serif; width: 270px; margin: 12px; color: #15171c; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; justify-content: space-between; margin: 4px 0; color: #555; gap: 8px; }
